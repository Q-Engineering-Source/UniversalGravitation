def digestBytes = { byte[] value -> HexFormat.of().withUpperCase().formatHex(MessageDigest.getInstance('SHA-256').digest(value)) }
def digestFile = { File target ->
    if (!target.isFile()) throw new GradleException("Missing native gate identity input: ${target}")
    def hash = MessageDigest.getInstance('SHA-256')
    target.withInputStream { stream ->
        byte[] buffer = new byte[8192]; int read
        while ((read = stream.read(buffer)) != -1) hash.update(buffer, 0, read)
    }
    HexFormat.of().withUpperCase().formatHex(hash.digest())
}
def describeFiles = { Collection<File> files ->
    // Preserve first-file canonical identity while avoiding Groovy unique's repeated key comparisons.
    def canonicalFiles = new LinkedHashMap<String, File>()
    files.findAll { it.isFile() }.each { File input ->
        String canonical = input.canonicalPath
        if (!canonicalFiles.containsKey(canonical)) canonicalFiles.put(canonical, input)
    }
    def rows = canonicalFiles.values().collect { File input ->
        [path: project.relativePath(input).replace('\\','/'), bytes: input.length(), sha256: digestFile(input)]
    }.sort { it.path }
    [sha256: digestBytes(JsonOutput.toJson(rows).getBytes('UTF-8')), files: rows]
}
def describeSource = {
    describeFiles(fileTree(projectDir) {
        include 'src/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat'
    }.files)
}
def describeMain = {
    def files = []
    sourceSets.main.output.files.each { File output ->
        if (output.isDirectory()) files.addAll(fileTree(output).files)
        else if (output.isFile()) files.add(output)
    }
    describeFiles(files)
}
def nativeCaseSetSha256 = 'A878EFC56BCC17EFE80F3A6988856FF420BEA32CE45638833DA15397F29538F8'
def validateNativeCaseIds = { List<String> ids ->
    String actual = digestBytes((ids.sort(false).join('\n') + '\n').getBytes('UTF-8'))
    if (ids.size() != 40 || ids.toSet().size() != 40 || actual != nativeCaseSetSha256)
        throw new GradleException('Native FML case identities do not match the exact mandatory 40-case set')
    actual
}

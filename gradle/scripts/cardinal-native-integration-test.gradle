def invocation = java.util.UUID.randomUUID().toString()
def reportDirectory = layout.buildDirectory.dir("reports/cardinal-native/${invocation}")
def result = reportDirectory.map { it.file('result.txt') }
def fixture = tasks.register('cardinalNativeFixtureJar', Jar) {
    dependsOn tasks.named('nativeIntegrationClasses'), tasks.named('testClasses')
    archiveFileName = 'ug-cardinal-native-fixture.jar'
    destinationDirectory = layout.buildDirectory.dir('cardinal-native-fixture')
    from sourceSets.nativeIntegration.output
    from sourceSets.test.output
}
def releaseJar = tasks.named(enable_shadow.toBoolean() ? 'remapShadowJar' : 'remapJar')
def identity = null
def identityHash = null
def gateVerified = false
def nativeStateBefore = null
def observedJunit = null
def freshStateProof = null
// This value is only set after this invocation actually verifies all 40 normal-FML cases.
// Historical cross-script key retained; it now carries only the exact 40-case contract.
project.ext.ugFreshNative39StateTransition = { -> gateVerified ? freshStateProof : null }
File observedMods = null
File observedChb = null
def jarInputs = { File directory ->
    if (!directory.isDirectory()) throw new GradleException("Missing native host dependency directory: ${directory}")
    describeFiles(directory.listFiles().findAll { it.isFile() && it.name.endsWith('.jar') })
}

def validateCurrentIdentity = {
    project.ext.ugVerifyHostMappingIdentity.call()
    if (identity == null || identityHash == null) throw new GradleException('Native FML gate did not create this invocation identity')
    if (describeSource().sha256 != identity.source.sha256 || describeMain().sha256 != identity.mainOutput.sha256)
        throw new GradleException('Native gate source or main output changed after host observation')
    if (digestFile(fixture.get().archiveFile.get().asFile) != identity.fixtureSha256
            || digestFile(releaseJar.get().archiveFile.get().asFile) != identity.ugArtifactSha256)
        throw new GradleException('Native gate fixture or UG artifact identity changed')
    if (digestFile(observerAgent.get()) != identity.observerAgentSha256
            || digestFile(observerBootstrap.get()) != identity.observerBootstrapSha256
            || jarInputs(observedMods).sha256 != identity.runtimeMods.sha256
            || jarInputs(observedChb).sha256 != identity.chbArtifacts.sha256)
        throw new GradleException('Native gate observer or runtime dependency identity changed')
}
def gate = tasks.register('cardinalNativeIntegrationTest') {
    group = 'verification'
    description = 'Mandatory real FML native callback acceptance for this source and release artifact.'
    dependsOn fixture, releaseJar, tasks.named('runClient'), nativeCaseContract
    doNotTrackState('Requires a fresh normal-client report bound to this invocation and artifact')
    doLast {
        if (tasks.named('runClient', JavaExec).get().executionResult.get().exitValue != 0)
            throw new GradleException('Native FML host did not exit normally with code zero')
        File report = result.get().asFile
        String header = "PASS tests=40 started=40 unique=40 succeeded=40 failed=0 aborted=0 skipped=0\nnonce=${invocation}\nidentity=${identityHash}\ncaseSetSha256=${nativeCaseSetSha256}\n"
        if (!report.isFile() || !report.getText('UTF-8').startsWith(header))
            throw new GradleException("Native FML acceptance has no fresh matching 40-case report: ${report}")
        def cases = report.readLines('UTF-8').findAll { it.startsWith('SUCCESSFUL [engine:') }
        def caseIds = cases.collect { String line ->
            int end = line.indexOf('] ')
            if (end < 0) throw new GradleException('Native FML case line has no complete UniqueId delimiter')
            line.substring('SUCCESSFUL '.length(), end + 1)
        }
        validateNativeCaseIds(caseIds)
        validateCurrentIdentity()
        def transition = null
        if (nativeStateBefore != null) {
            transition = (project.ext.ugSleepNativeState.afterNative.call(nativeStateBefore, reportDirectory.get().asFile, observedJunit)
                    + [nonce: invocation, tests: 40, started: 40, unique: 40, caseSetSha256: nativeCaseSetSha256, succeeded: 40, failed: 0, aborted: 0, skipped: 0])
        }
        def receipt = [status:'PASS', nonce:invocation, identitySha256:identityHash,
                       reportSha256:digestFile(report), tests:40, started:40, unique:40, caseSetSha256:nativeCaseSetSha256, succeeded:40, failed:0, aborted:0, skipped:0,
                       identity:identity, stateTransition:transition]
        File verifiedReceipt = reportDirectory.get().file('verified-receipt.json').asFile
        java.nio.file.Files.writeString(verifiedReceipt.toPath(), JsonOutput.prettyPrint(JsonOutput.toJson(receipt)),
                java.nio.charset.StandardCharsets.UTF_8, java.nio.file.StandardOpenOption.CREATE_NEW,
                java.nio.file.StandardOpenOption.WRITE)
        if (transition != null) freshStateProof = [nonce: invocation, identityHash: identityHash,
                receipt: verifiedReceipt.canonicalPath, sha256: digestFile(verifiedReceipt), transition: transition]
        gateVerified = true
    }
}
tasks.named('check').configure { dependsOn gate }
tasks.named('build').configure { dependsOn gate }
['check','build'].each { String taskName ->
    tasks.named(taskName).configure {
        doLast {
            if (!gateVerified) throw new GradleException("${taskName} did not execute its mandatory fresh native FML gate")
            validateCurrentIdentity()
        }
    }
}
tasks.named('runClient', JavaExec).configure { JavaExec host ->
    mustRunAfter fixture, releaseJar, tasks.named('test'), tasks.named('sleepNativeFixtureJar')
    doFirst {
        if (gradle.taskGraph.hasTask(gate.get())) {
            if (gradle.taskGraph.hasTask(tasks.named('clientIntegrationTest').get()))
                throw new GradleException('Run client-route and native fixture profiles in separate normal FML invocations')
            if (digestFile(observerAgent.get()) != agentHash || digestFile(observerBootstrap.get()) != bootstrapHash)
                throw new GradleException('Frozen native pool observer identity mismatch')
            project.ext.ugPrepareHostMappingIdentity.call(reportDirectory.get().asFile)
            def before = host.classpath.files.collect { it.absolutePath }.sort()
            def junit = sourceSets.nativeIntegration.runtimeClasspath.filter { dependency ->
                ['junit-', 'opentest4j-', 'apiguardian-'].any { dependency.name.startsWith(it) }
            }
            host.classpath = host.classpath.plus(junit)
            File mods = new File(host.workingDir, 'mods'); mods.mkdirs()
            def modFiles = mods.listFiles().findAll { it.isFile() && it.name.endsWith('.jar') }
            if (!modFiles.any { it.name.toLowerCase().contains('fugue') }
                    || !modFiles.any { it.name.toLowerCase().contains('scalar') })
                throw new GradleException('Normal native FML host requires Fugue and scalar')
            if (modFiles.any { it.name == 'ug-client-route-integration-fixture.jar' })
                throw new GradleException('Native host mods directory contains the other fixture profile')
            java.nio.file.Files.copy(fixture.get().archiveFile.get().asFile.toPath(),
                    new File(mods, 'ug-cardinal-native-fixture.jar').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            File directory = reportDirectory.get().asFile; directory.mkdirs()
            new File(directory, 'host-classpath.txt').setText('NORMAL HOST\n'+before.join('\n')
                    +'\nWITH JUNIT\n'+host.classpath.files.collect { it.absolutePath }.sort().join('\n')+'\n', 'UTF-8')
            def chbPin = new Properties()
            file('gradle/chb-artifact.properties').withInputStream { chbPin.load(it) }
            observedMods = mods
            observedChb = file(providers.gradleProperty('chb_artifact_dir').getOrElse(
                    new File(gradle.gradleUserHomeDir, 'artifacts/UG-CHB-CAPSULE-V1/'+chbPin.getProperty('candidate')).path))
            identity = [nonce:invocation, source:describeSource(), mainOutput:describeMain(),
                        fixtureSha256:digestFile(fixture.get().archiveFile.get().asFile),
                        ugArtifact:releaseJar.get().archiveFile.get().asFile.name,
                        ugArtifactSha256:digestFile(releaseJar.get().archiveFile.get().asFile),
                        observerAgentSha256:digestFile(observerAgent.get()), observerBootstrapSha256:digestFile(observerBootstrap.get()),
                        workingDirectory:host.workingDir.canonicalPath,
                        runtimeMods:jarInputs(observedMods), chbArtifacts:jarInputs(observedChb)]
            if (gradle.taskGraph.hasTask(tasks.named('sleepNativeEvidenceGate').get())
                    || providers.gradleProperty('sleepEvidenceReceipt').isPresent()) {
                observedJunit = junit.files.toList()
                nativeStateBefore = project.ext.ugSleepNativeState.beforeNative.call(directory, observedJunit)
                identity.stateBefore = nativeStateBefore
            }
            String encoded = JsonOutput.toJson(identity); identityHash = digestBytes(encoded.getBytes('UTF-8'))
            new File(directory,'input-identity.json').setText(JsonOutput.prettyPrint(encoded),'UTF-8')
            host.jvmArgs "-javaagent:${observerAgent.get().absolutePath}=${new File(directory,'pool-agent').absolutePath}"
            host.systemProperty 'unigrav.nativeIntegration.result', result.get().asFile.absolutePath
            host.systemProperty 'unigrav.nativeIntegration.nonce', invocation
            host.systemProperty 'unigrav.nativeIntegration.identity', identityHash
            host.systemProperty 'mixin.debug.export', 'true'
            host.systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
            project.ext.ugVerifyHostMappingIdentity.call()
        }
    }
}

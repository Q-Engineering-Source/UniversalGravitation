def commonRunnerIdentity = {
    File classes = new File(commonClasses(), 'wi/unigrav/core/floor')
    List<File> files = (classes.listFiles() ?: new File[0]).findAll { File entry ->
        entry.isFile() && (entry.name == 'FloorAggregationPerfRunner.class'
                || (entry.name.startsWith('FloorAggregationPerfRunner$') && entry.name.endsWith('.class')))
    }.sort { File left, File right -> left.name <=> right.name }
    if (files.isEmpty()) throw new GradleException("Compiled common runner class family is missing: ${classes}")
    List<Map> rows = files.collect { File entry ->
        [name: entry.name, bytes: entry.length(), sha256: sha256File(entry)]
    }
    [rows: rows, sha256: sha256Bytes(JsonOutput.toJson(rows).getBytes(StandardCharsets.UTF_8))]
}

def java25 = {
    if (JavaVersion.current().majorVersion != '25') {
        throw new GradleException("Floor perf requires the project's Java 25 runtime; Gradle currently uses ${System.getProperty('java.version')}")
    }
    String suffix = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('win') ? '.exe' : ''
    File exe = new File(System.getProperty('java.home'), "bin/java${suffix}")
    if (!exe.isFile()) throw new GradleException("Java 25 executable is missing: ${exe}")
    exe
}

def processTreeAlive = { Process process, List<ProcessHandle> descendants ->
    process.isAlive() || descendants.any { ProcessHandle handle -> handle.isAlive() }
}

def awaitProcessTreeExit = { Process process, List<ProcessHandle> descendants, Long timeout, TimeUnit unit ->
    long deadline = System.nanoTime() + unit.toNanos(timeout.longValue())
    boolean interrupted = false
    while (processTreeAlive(process, descendants)) {
        long remaining = deadline - System.nanoTime()
        if (remaining <= 0L) break
        try {
            TimeUnit.NANOSECONDS.sleep(Math.min(remaining, TimeUnit.MILLISECONDS.toNanos(50)))
        } catch (InterruptedException ignored) {
            interrupted = true
            break
        }
    }
    interrupted
}

def terminateOwnedProcessTree = { Process process, Throwable primary, String operation ->
    if (!process.isAlive()) return primary
    Throwable cleanupFailure = null
    List<ProcessHandle> descendants = []
    try {
        descendants = process.toHandle().descendants().toList()
    } catch (Throwable discoveryFailure) {
        cleanupFailure = discoveryFailure
    }
    descendants.each { ProcessHandle handle ->
        try {
            if (handle.isAlive()) handle.destroy()
        } catch (Throwable destroyFailure) {
            if (cleanupFailure == null) cleanupFailure = destroyFailure
            else if (cleanupFailure != destroyFailure) cleanupFailure.addSuppressed(destroyFailure)
        }
    }
    try {
        process.destroy()
    } catch (Throwable destroyFailure) {
        if (cleanupFailure == null) cleanupFailure = destroyFailure
        else if (cleanupFailure != destroyFailure) cleanupFailure.addSuppressed(destroyFailure)
    }
    boolean interrupted = awaitProcessTreeExit(process, descendants, 3, TimeUnit.SECONDS)
    if (processTreeAlive(process, descendants)) {
        descendants.each { ProcessHandle handle ->
            try {
                if (handle.isAlive()) handle.destroyForcibly()
            } catch (Throwable forceFailure) {
                if (cleanupFailure == null) cleanupFailure = forceFailure
                else if (cleanupFailure != forceFailure) cleanupFailure.addSuppressed(forceFailure)
            }
        }
        try {
            if (process.isAlive()) process.destroyForcibly()
        } catch (Throwable forceFailure) {
            if (cleanupFailure == null) cleanupFailure = forceFailure
            else if (cleanupFailure != forceFailure) cleanupFailure.addSuppressed(forceFailure)
        }
        interrupted |= awaitProcessTreeExit(process, descendants, 5, TimeUnit.SECONDS)
    }
    if (processTreeAlive(process, descendants)) {
        GradleException failure = new GradleException("${operation} could not terminate owned process tree pid=${process.pid()}")
        if (cleanupFailure == null) cleanupFailure = failure
        else cleanupFailure.addSuppressed(failure)
    }
    if (interrupted) Thread.currentThread().interrupt()
    if (cleanupFailure != null) {
        if (primary != null) {
            if (cleanupFailure != primary) primary.addSuppressed(cleanupFailure)
            return primary
        }
        throw new GradleException("${operation} cleanup failed", cleanupFailure)
    }
    primary
}

def runLogged = { List<String> command, File stdout, File stderr, File workingDirectory, long timeoutMinutes ->
    stdout.parentFile.mkdirs()
    stderr.parentFile.mkdirs()
    if (stdout.exists() || stderr.exists()) {
        throw new GradleException("Refusing to overwrite child process evidence stdout=${stdout} stderr=${stderr}")
    }
    List<String> processCommand = command.collect { Object argument -> String.valueOf(argument) }
    ProcessBuilder builder = new ProcessBuilder(processCommand)
            .redirectOutput(stdout)
            .redirectError(stderr)
    if (workingDirectory != null) {
        if (!workingDirectory.isDirectory()) {
            throw new GradleException("Floor performance child working directory is missing: ${workingDirectory}")
        }
        builder.directory(workingDirectory)
    }
    Process process = builder.start()
    try {
        if (!process.waitFor(timeoutMinutes, TimeUnit.MINUTES)) {
            GradleException failure = new GradleException("Timed out after ${timeoutMinutes} minutes: ${processCommand.join(' ')}; stdout=${stdout}; stderr=${stderr}")
            terminateOwnedProcessTree(process, failure, 'floor performance child timeout')
            throw failure
        }
    } catch (InterruptedException interrupted) {
        terminateOwnedProcessTree(process, interrupted, 'floor performance child interrupted')
        Thread.currentThread().interrupt()
        throw new GradleException("Interrupted while waiting for floor performance child: ${command.join(' ')}", interrupted)
    }
    int exit = process.exitValue()
    [exit: exit, stdout: stdout, stderr: stderr, command: processCommand,
     workingDirectory: workingDirectory == null ? null : workingDirectory.canonicalPath]
}

def writeJavaArgumentFile = { List<String> command, File argumentFile ->
    List<String> actualCommand = command.collect { Object argument -> String.valueOf(argument) }
    if (actualCommand.size() < 2) {
        throw new GradleException('Java argument-file launch requires the executable and at least one argument')
    }
    if (actualCommand.any { it.contains('\n') || it.contains('\r') }) {
        throw new GradleException('Java argument-file launch arguments cannot contain line breaks')
    }
    if (argumentFile.exists()) {
        throw new GradleException("Refusing to overwrite Java argument-file evidence: ${argumentFile}")
    }
    String contents = actualCommand.drop(1).collect { String argument ->
        '"' + argument.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }.join(System.lineSeparator()) + System.lineSeparator()
    Files.writeString(argumentFile.toPath(), contents, StandardCharsets.UTF_8,
            java.nio.file.StandardOpenOption.CREATE_NEW, java.nio.file.StandardOpenOption.WRITE)
    [
            logicalCommand: actualCommand,
            processCommand: [actualCommand.first(), "@${argumentFile.canonicalPath}"],
            argumentFile: argumentFile.canonicalPath,
            argumentFileSha256: sha256File(argumentFile)
    ]
}


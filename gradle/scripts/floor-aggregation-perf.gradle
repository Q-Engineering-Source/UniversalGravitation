def verifyExternalClasspathSources = {
    File manifestFile = new File(outputRoot(), 'external-classpath-manifest.json')
    if (!manifestFile.isFile()) throw new GradleException("Supplemental external classpath has not been pinned: ${manifestFile}")
    def manifest = new JsonSlurper().parse(manifestFile)
    List<File> sources = externalClasspathSnapshot().externalSources
    List<String> actualOrigins = sources.collect { it.canonicalPath }
    List<String> expectedOrigins = manifest.entries.collect { it.sourceOrigin as String }
    if (actualOrigins != expectedOrigins) {
        throw new GradleException("External classpath source order/set changed after pinning expected=${expectedOrigins.size()} actual=${actualOrigins.size()}")
    }
    sources.eachWithIndex { File source, int index ->
        Map entry = manifest.entries[index] as Map
        if (isGeneratedMappingArchive(source)) {
            File staged = new File(entry.stagedPath as String).canonicalFile
            if (!staged.isFile() || sha256File(staged) != (entry.sha256 as String)
                    || source.length() != (entry.bytes as long) || staged.length() != (entry.bytes as long)) {
                throw new GradleException("Pinned generated mapping archive bytes changed source=${source} staged=${staged}")
            }
            List<Map> sourceRows = zipEntryPayloadRows(source)
            List<Map> stagedRows = zipEntryPayloadRows(staged)
            String sourcePayload = zipEntryPayloadSha256(source)
            String stagedPayload = zipEntryPayloadSha256(staged)
            if (sourceRows != stagedRows || sourcePayload != stagedPayload
                    || (entry.contentSha256 != null && sourcePayload != entry.contentSha256)
                    || (entry.contentEntries != null && stagedRows != entry.contentEntries)) {
                throw new GradleException("Generated mapping archive entries changed after pinning source=${source} staged=${staged}")
            }
            if (entry.identityKind == 'ZIP_ENTRY_PAYLOADS_SHA256'
                    && (entry.sourceSha256 as String) != (entry.sha256 as String)) {
                throw new GradleException("Generated mapping archive did not have exact source/staged bytes when pinned: ${source}")
            }
            logger.lifecycle("Verified generated mapping archive source=${source} pinnedRawSha=${entry.sha256} currentRawSha=${sha256File(source)} stagedRawSha=${sha256File(staged)} metadataOnly=${sha256File(source) != entry.sha256} payloadEntries=${JsonOutput.toJson(sourceRows)}")
        } else {
            String observed = source.isDirectory()
                    ? sha256Bytes(JsonOutput.toJson(inventoryDirectory(source)).getBytes(StandardCharsets.UTF_8))
                    : sha256File(source)
            String expected = entry.sha256 as String
            if (observed != expected) {
                throw new GradleException("External classpath source changed after pinning source=${source} expected=${expected} actual=${observed}")
            }
        }
    }
}

def verifyExistingPreparedOutput = { File output, File baseRoot, Map paths, String identitySha,
                                    Map compiled, Map api10, Map externalGraph ->
    File classpathFile = new File(output, 'external-classpath.txt')
    File externalManifestFile = new File(output, 'external-classpath-manifest.json')
    File baselineInputFile = new File(output, 'baseline-input-manifest.json')
    if (![classpathFile, externalManifestFile, baselineInputFile].every { it.isFile() }) {
        throw new GradleException("Refusing to reuse incomplete floor performance input directory: ${output}")
    }
    def externalManifest = new JsonSlurper().parse(externalManifestFile)
    def baselineInput = new JsonSlurper().parse(baselineInputFile)
    if (externalManifest.protocol != floorPerfProtocol
            || externalManifest.status != 'SUPPLEMENTAL_INPUTS_PINNED'
            || externalManifest.sourceGraphEntryCount != externalGraph.runtimeGraph.size()
            || externalManifest.excluded != externalGraph.excludedRows
            || baselineInput.protocol != floorPerfProtocol
            || baselineInput.status != 'R114_BASELINE_VERIFIED_WITH_SUPPLEMENTAL_EXTERNAL_CP'
            || baselineInput.frozenBaselinePath != baseRoot.canonicalPath
            || baselineInput.frozenIdentitySha256 != identitySha
            || baselineInput.frozenCompiledInventorySha256 != compiled.sha256
            || baselineInput.frozenCompiledFileCount != compiled.files
            || baselineInput.frozenCompiledBytes != compiled.bytes
            || baselineInput.frozenMainClasses != paths.mainClasses.canonicalPath
            || baselineInput.frozenTestClasses != paths.testClasses.canonicalPath
            || baselineInput.frozenApi10Root != paths.apiRoot.canonicalPath
            || baselineInput.frozenApi10InventorySha256 != api10.sha256
            || baselineInput.frozenApi10FileCount != api10.files
            || baselineInput.frozenApi10Bytes != api10.bytes
            || baselineInput.frozenMainResources != paths.resources.canonicalPath
            || baselineInput.historicExternalClasspath != 'NOT_SAVED_IN_R114; see external-classpath-manifest.json for the separately captured supplemental set'
            || baselineInput.externalClasspathManifest != externalManifestFile.canonicalPath
            || baselineInput.externalClasspathManifestSha256 != sha256File(externalManifestFile)) {
        throw new GradleException("Pinned baseline/external manifests do not match current fixed inputs: ${output}")
    }

    List<Map> entries = externalManifest.entries as List<Map>
    List<String> currentOrigins = externalGraph.externalSources.collect { it.canonicalPath }
    List<String> manifestOrigins = entries.collect { it.sourceOrigin as String }
    if (currentOrigins != manifestOrigins || entries.size() != externalGraph.externalSources.size()) {
        throw new GradleException("Pinned external classpath source set/order changed expected=${manifestOrigins.size()} actual=${currentOrigins.size()}")
    }
    File stagedRoot = new File(output, 'external-inputs').canonicalFile
    if (!stagedRoot.isDirectory()) throw new GradleException("Pinned external dependency root is missing: ${stagedRoot}")
    Set<String> expectedStagedPaths = new LinkedHashSet<>()
    List<String> expectedClasspath = []
    entries.eachWithIndex { Map entry, int index ->
        File source = externalGraph.externalSources[index]
        String safeName = source.name.replaceAll('[^A-Za-z0-9._-]', '_')
        File target = new File(stagedRoot, String.format(Locale.ROOT, '%04d-', index) + safeName).canonicalFile
        if (entry.ordinal != index || entry.sourceOrigin != source.canonicalPath
                || entry.stagedPath != target.canonicalPath
                || entry.kind != (source.isDirectory() ? 'directory' : 'file')) {
            throw new GradleException("Pinned external dependency identity/order mismatch at entry ${index}")
        }
        if (!target.toPath().startsWith(stagedRoot.toPath()) || !target.exists()) {
            throw new GradleException("Pinned external dependency is missing or escapes its root: ${target}")
        }
        String sourceHash = source.isDirectory()
                ? sha256Bytes(JsonOutput.toJson(inventoryDirectory(source)).getBytes(StandardCharsets.UTF_8))
                : sha256File(source)
        String stagedHash
        long stagedBytes
        long stagedFiles
        if (target.isDirectory()) {
            List<Map> inventory = inventoryDirectory(target)
            stagedHash = sha256Bytes(JsonOutput.toJson(inventory).getBytes(StandardCharsets.UTF_8))
            stagedBytes = inventory.collect { it.bytes as long }.sum(0L) as long
            stagedFiles = inventory.size()
        } else {
            stagedHash = sha256File(target)
            stagedBytes = target.length()
            stagedFiles = 1L
        }
        long sourceBytes = source.isDirectory()
                ? inventoryDirectory(source).collect { it.bytes as long }.sum(0L) as long
                : source.length()
        long sourceFiles = source.isDirectory() ? inventoryDirectory(source).size() : 1L
        boolean sourceMatches = sourceHash == entry.sha256
        if (isGeneratedMappingArchive(source)) {
            if (source.isDirectory() || target.isDirectory()) {
                throw new GradleException("Generated mapping archive identity is assigned to a directory: ${source}")
            }
            String sourcePayload = zipEntryPayloadSha256(source)
            String stagedPayload = zipEntryPayloadSha256(target)
            List<Map> sourceRows = zipEntryPayloadRows(source)
            List<Map> stagedRows = zipEntryPayloadRows(target)
            String expectedPayload = entry.contentSha256 == null ? stagedPayload : entry.contentSha256 as String
            List<Map> expectedRows = entry.contentEntries == null ? stagedRows : entry.contentEntries as List<Map>
            sourceMatches = sourcePayload == expectedPayload && stagedPayload == expectedPayload
                    && sourceRows == expectedRows && stagedRows == expectedRows
                    && ((entry.identityKind == null) || (entry.identityKind == 'ZIP_ENTRY_PAYLOADS_SHA256'
                    && (entry.sourceSha256 as String) == (entry.sha256 as String)))
            logger.lifecycle("Verified staged mapping archive source=${source} pinnedRawSha=${entry.sha256} currentRawSha=${sha256File(source)} stagedRawSha=${stagedHash} metadataOnly=${sha256File(source) != entry.sha256} payloadEntries=${JsonOutput.toJson(sourceRows)}")
        }
        if (!sourceMatches || stagedHash != entry.sha256
                || sourceBytes != (entry.bytes as long) || stagedBytes != (entry.bytes as long)
                || sourceFiles != (entry.fileCount as long) || stagedFiles != (entry.fileCount as long)) {
            throw new GradleException("Pinned external dependency bytes/hash changed source=${source} staged=${target}")
        }
        expectedStagedPaths.add(target.canonicalPath)
        expectedClasspath.add(target.canonicalPath)
    }
    Set<String> actualStagedPaths = (stagedRoot.listFiles() ?: new File[0]).collect { it.canonicalPath } as Set<String>
    if (actualStagedPaths != expectedStagedPaths) {
        throw new GradleException("Pinned external dependency directory has extra or missing entries: ${stagedRoot}")
    }
    List<String> observedClasspath = classpathFile.readLines('UTF-8').findAll { !it.isBlank() }
    if (observedClasspath != expectedClasspath) {
        throw new GradleException("Pinned external-classpath.txt differs from sealed manifest: ${classpathFile}")
    }

    externalGraph.externalSources.eachWithIndex { File source, int index ->
        Map entry = entries[index]
        if (isGeneratedMappingArchive(source)) {
            File staged = new File(entry.stagedPath as String).canonicalFile
            String payload = zipEntryPayloadSha256(source)
            String stagedPayload = zipEntryPayloadSha256(staged)
            List<Map> payloadRows = zipEntryPayloadRows(source)
            List<Map> stagedRows = zipEntryPayloadRows(staged)
            if (payload != stagedPayload || payloadRows != stagedRows
                    || (entry.contentSha256 != null && payload != entry.contentSha256)
                    || (entry.contentEntries != null && stagedRows != entry.contentEntries)) {
                throw new GradleException("Generated mapping archive payload changed after pinning: ${source}")
            }
            if (entry.identityKind == 'ZIP_ENTRY_PAYLOADS_SHA256'
                    && (entry.sourceSha256 as String) != (entry.sha256 as String)) {
                throw new GradleException("Generated mapping archive source/staged bytes differed when pinned: ${source}")
            }
            logger.lifecycle("Verified generated mapping archive source=${source} pinnedRawSha=${entry.sha256} currentRawSha=${sha256File(source)} stagedRawSha=${sha256File(staged)} metadataOnly=${sha256File(source) != entry.sha256} payloadEntries=${JsonOutput.toJson(payloadRows)}")
        } else {
            String observed = source.isDirectory()
                    ? sha256Bytes(JsonOutput.toJson(inventoryDirectory(source)).getBytes(StandardCharsets.UTF_8))
                    : sha256File(source)
            if (observed != entry.sha256) {
                throw new GradleException("External classpath source changed after pinning: ${source}")
            }
        }
    }
}


def pinnedExternalFiles = {
    File path = externalClasspathManifest()
    if (!path.isFile()) throw new GradleException("Supplemental external classpath has not been pinned: ${path}")
    List<File> entries = path.readLines('UTF-8').findAll { !it.isBlank() }.collect { new File(it).canonicalFile }
    if (entries.isEmpty()) throw new GradleException('Supplemental external classpath is empty')
    entries.each { if (!it.exists()) throw new GradleException("Pinned supplemental classpath entry disappeared: ${it}") }
    entries
}

def externalClasspathSnapshot = {
    Set<String> excluded = new LinkedHashSet<>()
    (sourceSets.main.output.files + sourceSets.test.output.files).each { File entry ->
        excluded.add(entry.canonicalFile.path)
    }
    File activeUie = file("${rootProject.projectDir}/${uie_classes_dir}").canonicalFile
    if (activeUie.exists()) excluded.add(activeUie.path)

    List<File> runtimeGraph = sourceSets.test.runtimeClasspath.files.collect { it.canonicalFile }
    LinkedHashSet<File> externalSources = new LinkedHashSet<>()
    List<Map> excludedRows = []
    runtimeGraph.each { File entry ->
        if (excluded.contains(entry.path)) {
            excludedRows.add([path: entry.path, reason: entry == activeUie
                    ? 'active UIE path replaced by the accepted frozen API10 inventory'
                    : 'current main/test output; excluded to prevent floor-class shadowing'])
            return
        }
        if (!entry.exists()) throw new GradleException("Actual test runtime dependency is missing: ${entry}")
        externalSources.add(entry)
    }
    if (externalSources.isEmpty()) throw new GradleException('Current test runtime graph yielded no supplemental external dependencies')
    [runtimeGraph: runtimeGraph, excludedRows: excludedRows, externalSources: new ArrayList<>(externalSources)]
}

def externalClasspathSources = {

tasks.register('prepareFloorPerfInputs') {
    group = 'verification'
    description = 'Verify immutable R114 scalar/API10 input, then pin the actual external dependency graph outside the worktree.'
    // Resolve generated mapped dependencies only after the normal project build
    // has completed; otherwise an external artifact can change between capture
    // and common compilation, making a sealed snapshot immediately stale.
    dependsOn tasks.named('classes')
    doLast {
        File baseRoot = baselineRoot()
        File output = outputRoot()
        if (!baseRoot.isDirectory()) throw new GradleException("Frozen R114 baseline directory is missing: ${baseRoot}")
        if (output.toPath().startsWith(projectDir.canonicalFile.toPath())
                || output.toPath().startsWith(baseRoot.canonicalFile.toPath())) {
            throw new GradleException("floorPerfOutput must be an independent directory outside the worktree and frozen baseline: ${output}")
        }
        File identity = new File(baseRoot, 'scalar-baseline.json')
        String identitySha = sha256File(identity)
        if (identitySha != acceptedBaselineManifestSha) {
            throw new GradleException("R114 scalar baseline identity mismatch expected=${acceptedBaselineManifestSha} actual=${identitySha}")
        }
        def parsed = new JsonSlurper().parse(identity)
        if (parsed.compiledClasses.files != 763 || parsed.api10CompileInput.files != 866) {
            throw new GradleException("R114 scalar/API10 inventory counts changed: compiled=${parsed.compiledClasses.files}, api10=${parsed.api10CompileInput.files}")
        }
        def paths = baselinePaths()
        if (![paths.mainClasses, paths.testClasses, paths.apiRoot, paths.resources].every { it.exists() }) {
            throw new GradleException('One or more frozen R114 class/API/resource roots are missing')
        }
        def compiled = verifyInventory(paths.compiledInventory, paths.compiledRoot,
                acceptedCompiledInventorySha, 'R114 compiled classes')
        def api10 = verifyInventory(paths.apiInventory, paths.apiRoot,
                acceptedApiInventorySha, 'R114 API10 compile input')

        Map externalGraph = externalClasspathSnapshot()
        List<File> runtimeGraph = externalGraph.runtimeGraph
        List<File> externalSources = externalGraph.externalSources
        List<Map> excludedRows = externalGraph.excludedRows

        if (output.exists() && output.listFiles()?.length > 0) {
            verifyExistingPreparedOutput(output, baseRoot, paths, identitySha, compiled, api10, externalGraph)
            logger.lifecycle("Verified and reused sealed floor performance inputs entries=${externalSources.size()} output=${output}")
            return
        }

        output.mkdirs()
        File stagedRoot = new File(output, 'external-inputs')
        stagedRoot.mkdirs()
        List<Map> stagedEntries = []
        List<String> stagedClassPath = []
        externalSources.eachWithIndex { File source, int index ->
            String prefix = String.format(Locale.ROOT, '%04d-', index)
            String safeName = source.name.replaceAll('[^A-Za-z0-9._-]', '_')
            File target = new File(stagedRoot, prefix + safeName)
            if (source.isDirectory()) {
                target.mkdirs()
                Files.walk(source.toPath()).withCloseable { stream ->
                    stream.filter { Files.isRegularFile(it) }.forEach { Path input ->
                        Path relative = source.toPath().relativize(input)
                        Path destination = target.toPath().resolve(relative)
                        Files.createDirectories(destination.parent)
                        Files.copy(input, destination)
                    }
                }
            } else {
                Files.copy(source.toPath(), target.toPath())
            }
            List<Map> sourceInventory = source.isDirectory() ? inventoryDirectory(source) : null
            List<Map> targetInventory = target.isDirectory() ? inventoryDirectory(target) : null
            String sourceHash = source.isDirectory()
                    ? sha256Bytes(JsonOutput.toJson(sourceInventory).getBytes(StandardCharsets.UTF_8))
                    : sha256File(source)
            String targetHash = target.isDirectory()
                    ? sha256Bytes(JsonOutput.toJson(targetInventory).getBytes(StandardCharsets.UTF_8))
                    : sha256File(target)
            boolean mappingArchive = !source.isDirectory() && isGeneratedMappingArchive(source)
            String sourceContentSha = mappingArchive ? zipEntryPayloadSha256(source) : null
            String targetContentSha = mappingArchive ? zipEntryPayloadSha256(target) : null
            List<Map> sourceContentEntries = mappingArchive ? zipEntryPayloadRows(source) : null
            List<Map> targetContentEntries = mappingArchive ? zipEntryPayloadRows(target) : null
            if (sourceHash != targetHash) {
                throw new GradleException("Staged external dependency digest mismatch source=${source} target=${target}")
            }
            if (mappingArchive && (sourceContentSha != targetContentSha
                    || sourceContentEntries != targetContentEntries)) {
                throw new GradleException("Staged generated mapping archive payload mismatch source=${source} target=${target}")
            }
            stagedClassPath.add(target.canonicalPath)
            stagedEntries.add([
                    ordinal: index,
                    kind: source.isDirectory() ? 'directory' : 'file',
                    identityKind: mappingArchive ? 'ZIP_ENTRY_PAYLOADS_SHA256' : 'EXACT_BYTES_SHA256',
                    sourceOrigin: source.canonicalPath,
                    stagedPath: target.canonicalPath,
                    sourceSha256: sourceHash,
                    sha256: targetHash,
                    contentSha256: sourceContentSha,
                    contentEntries: sourceContentEntries,
                    fileCount: source.isDirectory() ? sourceInventory.size() : 1,
                    bytes: source.isDirectory()
                            ? sourceInventory.collect { it.bytes as long }.sum(0L)
                            : source.length()
            ])
        }

        File classpathFile = new File(output, 'external-classpath.txt')
        classpathFile.setText(stagedClassPath.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        File manifest = new File(output, 'external-classpath-manifest.json')
        manifest.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                protocol: floorPerfProtocol,
                status: 'SUPPLEMENTAL_INPUTS_PINNED',
                statement: 'This supplemental external classpath was captured from the current test runtime graph. It does not claim those external bytes were present in the historical R114 run.',
                identityPolicy: 'Exact staged bytes and raw SHA for all entries; only the generated Unimined .gradle/unimined/local/mappings/srg2mcp.jar additionally records exact sorted ZIP entry payload SHA because configuration rewrites ZIP entry timestamps.',
                sourceGraph: 'sourceSets.test.runtimeClasspath after excluding current main/test outputs and the active UIE directory replaced by the accepted frozen API10 inventory',
                sourceGraphEntryCount: runtimeGraph.size(),
                excluded: excludedRows,
                entries: stagedEntries
        ])) + System.lineSeparator(), 'UTF-8')
        File baselineInput = new File(output, 'baseline-input-manifest.json')
        baselineInput.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                protocol: floorPerfProtocol,
                status: 'R114_BASELINE_VERIFIED_WITH_SUPPLEMENTAL_EXTERNAL_CP',
                frozenBaselinePath: baseRoot.canonicalPath,
                frozenIdentitySha256: identitySha,
                frozenCompiledInventorySha256: compiled.sha256,
                frozenCompiledFileCount: compiled.files,
                frozenCompiledBytes: compiled.bytes,
                frozenMainClasses: paths.mainClasses.canonicalPath,
                frozenTestClasses: paths.testClasses.canonicalPath,
                frozenApi10Root: paths.apiRoot.canonicalPath,
                frozenApi10InventorySha256: api10.sha256,
                frozenApi10FileCount: api10.files,
                frozenApi10Bytes: api10.bytes,
                frozenMainResources: paths.resources.canonicalPath,
                historicExternalClasspath: 'NOT_SAVED_IN_R114; see external-classpath-manifest.json for the separately captured supplemental set',
                externalClasspathManifest: manifest.canonicalPath,
                externalClasspathManifestSha256: sha256File(manifest)
        ])) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle("Pinned supplemental external classpath entries=${stagedEntries.size()} manifest=${manifest}")
    }
}

def validateCandidateRetainedReport = { File reportFile ->
    if (!reportFile.isFile()) throw new GradleException("Candidate typed retained-count report is missing: ${reportFile}")
    Map report = new JsonSlurper().parse(reportFile) as Map
    List<String> expectedFixtures = [
            'DENSE', 'QUARTER_HOLES', 'MIXED_SIX_FACE', 'DOUBLE_SIX_FACE',
            'PUBLIC_MIXED_PROFILES', 'MULTILAYER', 'DENSE_WIDE', 'MULTILAYER_WIDE',
            'DIRTY_BATCH_CROSS_SECTION'
    ]
    if (report.protocol != floorPerfProtocol || report.status != 'PASS'
            || report.maskPayloadIsTotalHeapEstimate != Boolean.FALSE
            || report.tangentLookupPayloadIsTotalHeapEstimate != Boolean.FALSE
            || report.fixtureCount != expectedFixtures.size()
            || !(report.maskPayloadDefinition as String).contains('identity-distinct live Mask256 primitive long fields')
            || !(report.tangentLookupPayloadDefinition as String).contains('identity-distinct live 256-entry primitive short arrays')) {
        throw new GradleException("Candidate typed retained-count report header is invalid: ${reportFile}")
    }

    File expectedRoot = currentMainClasses().canonicalFile
    List<String> expectedClasses = [
            'wi.unigrav.core.floor.FloorFieldIndex',
            'wi.unigrav.core.floor.FloorChunkSources',
            'wi.unigrav.core.floor.FloorChunkCoverage',
            'wi.unigrav.core.floor.FloorWorldFields'
    ]
    List<Map> classRows = report.classIdentities as List<Map>
    if (classRows == null || classRows.size() != expectedClasses.size()
            || classRows.collect { it.name as String }.toSet() != expectedClasses.toSet()) {
        throw new GradleException("Candidate typed report does not identify the exact four production floor classes: ${reportFile}")
    }
    classRows.each { Map row ->
        String name = row.name as String
        File classFile = new File(expectedRoot, name.replace('.', '/') + '.class').canonicalFile
        if (!classFile.isFile() || row.codeSource != expectedRoot.canonicalPath
                || (row.bytes as long) != classFile.length()
                || !((row.sha256 as String).equalsIgnoreCase(sha256File(classFile)))) {
            throw new GradleException("Candidate typed report class identity mismatch name=${name} path=${classFile}")
        }
    }

    List<Map> rows = report.fixtures as List<Map>
    if (rows == null || rows.size() != expectedFixtures.size()
            || rows.collect { it.fixture as String }.toSet() != expectedFixtures.toSet()) {
        throw new GradleException("Candidate typed report fixture inventory is incomplete or duplicated: ${reportFile}")
    }
    def nonnegative = { Map values, String key, String fixture ->
        Object raw = values[key]
        if (!(raw instanceof Number)) throw new GradleException("Candidate typed count is not numeric fixture=${fixture} field=${key}")
        long value = ((Number) raw).longValue()
        if (value < 0L) throw new GradleException("Candidate typed count is negative fixture=${fixture} field=${key} value=${value}")
        value
    }
    def exactCounts = { Map actual, Map<String, Long> expected ->
        actual != null && actual.size() == expected.size() && expected.every { String key, Long value ->
            Object observed = actual[key]
            observed instanceof Number && ((Number) observed).longValue() == value.longValue()
        }
    }
    rows.each { Map row ->
        String fixture = row.fixture as String
        int width = (row.width as Number).intValue()
        boolean wide = fixture.endsWith('_WIDE')
        int expectedWidth = wide ? 16 : fixture == 'DIRTY_BATCH_CROSS_SECTION' ? 1 : 8
        if (width != expectedWidth || ((row.seed as Number).longValue() != 0x55474608L)) {
            throw new GradleException("Candidate typed report fixture parameters changed fixture=${fixture}")
        }
        Map counts = row.counts as Map
        if (counts == null || row.expectedChunks == null) {
            throw new GradleException("Candidate typed report is missing real chunk/count data fixture=${fixture}")
        }
        long expectedChunks = nonnegative(row, 'expectedChunks', fixture)
        long expectedPhysical = nonnegative(row, 'expectedPhysicalBlocks', fixture)
        long expectedEmitters = nonnegative(row, 'expectedEmitters', fixture)
        long expectedSections = nonnegative(row, 'expectedStorageSections', fixture)
        long publishedChunks = nonnegative(counts, 'publishedChunks', fixture)
        long coverages = nonnegative(counts, 'coverages', fixture)
        long sections = nonnegative(counts, 'sections', fixture)
        long routeBuckets = nonnegative(counts, 'routeBuckets', fixture)
        long routeShards = nonnegative(counts, 'routeShards', fixture)
        long coverageBuckets = nonnegative(counts, 'coverageBuckets', fixture)
        long groups = nonnegative(counts, 'groups', fixture)
        long physicalBlocks = nonnegative(counts, 'physicalBlocks', fixture)
        long emitters = nonnegative(counts, 'emitters', fixture)
        long identityMasks = nonnegative(counts, 'identityDistinctMasks', fixture)
        long maskPayload = nonnegative(counts, 'maskPayloadBytes', fixture)
        long tangentLookupFaces = nonnegative(counts, 'tangentNormalLookupFaces', fixture)
        long tangentLookupPayload = nonnegative(counts, 'tangentNormalLookupPayloadBytes', fixture)
        if (publishedChunks != expectedChunks || coverages != expectedChunks
                || physicalBlocks != expectedPhysical || emitters != expectedEmitters || sections != expectedSections
                || maskPayload != Math.multiplyExact(identityMasks, 32L)
                || tangentLookupPayload != Math.multiplyExact(tangentLookupFaces, 512L)
                || identityMasks > groups || coverageBuckets > groups || routeShards < routeBuckets
                || (expectedEmitters > 0L && groups == 0L)) {
            throw new GradleException("Candidate typed retained counts violate fixture invariants fixture=${fixture} counts=${counts}")
        }
        if (fixture == 'DOUBLE_SIX_FACE' && expectedEmitters != Math.multiplyExact(expectedPhysical, 2L)) {
            throw new GradleException('Candidate double-sided fixture lost one face per physical floor block')
        }
        if (fixture == 'MULTILAYER_WIDE') {
            Map shape = row.multiLayerWideShape as Map
            Map yCounts = shape?.layerYCounts as Map
            Map faceCounts = shape?.layerFaceCounts as Map
            Map expectedYCounts = ['16': 65536L, '20': 65536L, '24': 65536L, '28': 65536L]
            Map expectedFaceCounts = ['16|UP': 65536L, '20|DOWN': 65536L,
                                      '24|UP': 65536L, '28|DOWN': 65536L]
            if (width != 16 || expectedChunks != 256L || expectedPhysical != 262144L
                    || expectedEmitters != 262144L || expectedSections != 256L
                    || shape == null || nonnegative(shape, 'physicalBlocks', fixture) != 262144L
                    || nonnegative(shape, 'emitters', fixture) != 262144L
                    || nonnegative(shape, 'retainedStorageSections', fixture) != 256L
                    || !exactCounts(yCounts, expectedYCounts) || !exactCounts(faceCounts, expectedFaceCounts)
                    || nonnegative(shape, 'upLocalNormalMask', fixture) != 257L
                    || nonnegative(shape, 'downLocalNormalMask', fixture) != 4112L) {
                throw new GradleException("MULTILAYER_WIDE did not pass the actual four-layer storage shape gate: ${row}")
            }
        }
    }

    [
            protocol: floorPerfProtocol,
            status: 'PASS',
            reportPath: reportFile.canonicalPath,
            reportSha256: sha256File(reportFile),
            candidateFloorClassRoot: expectedRoot.canonicalPath,
            candidateFloorClassRows: classRows,
            helperClassPath: new File(candidateHelperClasses(), 'wi/unigrav/core/floor/FloorAggregationDiagnosticsRunner.class').canonicalPath,
            helperClassSha256: sha256File(new File(candidateHelperClasses(), 'wi/unigrav/core/floor/FloorAggregationDiagnosticsRunner.class')),
            commonRunnerClassSha256: sha256File(new File(commonClasses(), 'wi/unigrav/core/floor/FloorAggregationPerfRunner.class')),
            commonRunnerClassInventorySha256: commonRunnerIdentity().sha256,
            externalClasspathManifestSha256: sha256File(new File(outputRoot(), 'external-classpath-manifest.json')),
            preflightReceiptSha256: sha256File(new File(runOutputRoot(), 'linkage/preflight.json')),
            fixtureIds: expectedFixtures,
            fixtureCount: rows.size(),
            maskPayloadDefinition: report.maskPayloadDefinition,
            maskPayloadIsTotalHeapEstimate: false
    ]
}

tasks.register('verifyFloorPerfCommonLinkage') {
    group = 'verification'
    description = 'Run the common driver preflight independently against frozen scalar and current candidate class paths.'
    dependsOn tasks.named('compileFloorPerfCommonJava')
    dependsOn tasks.named('classes')
    doLast {
        File output = runOutputRoot()
        File commonOutput = commonClasses()
        File runnerClass = new File(commonOutput, 'wi/unigrav/core/floor/FloorAggregationPerfRunner.class')
        if (!runnerClass.isFile()) throw new GradleException("Common perf runner class is missing: ${runnerClass}")
        String runnerClassSha256 = sha256File(runnerClass)
        Map runnerIdentity = commonRunnerIdentity()
        File linkageDirectory = new File(output, 'linkage')
        linkageDirectory.mkdirs()
        File receipt = new File(linkageDirectory, 'preflight.json')
        Map inputs = [
                baseline: [cp: baselineChildClasspath(), root: baselinePaths().mainClasses.canonicalPath],
                candidate: [cp: candidateChildClasspath(), root: currentMainClasses().canonicalPath]
        ]
        if (receipt.isFile()) {
            Map existing = new JsonSlurper().parse(receipt) as Map
            if (existing.protocol != floorPerfProtocol || existing.status != 'PASS'
                    || existing.commonRunnerClassSha256 != runnerClassSha256
                    || existing.commonRunnerClassInventorySha256 != runnerIdentity.sha256
                    || existing.commonRunnerClassInventory != runnerIdentity.rows) {
                throw new GradleException("Existing common-linkage receipt is not a passing ${floorPerfProtocol} receipt: ${receipt}")
            }
            inputs.each { String variant, Map input ->
                Map row = existing[variant] as Map
                File stdout = new File(linkageDirectory, "${variant}.stdout.log")
                File stderr = new File(linkageDirectory, "${variant}.stderr.log")
                List<String> expectedCommand = [
                        java25().canonicalPath, '-Xms2g', '-Xmx2g', '-Dfile.encoding=UTF-8',
                        '-cp', input.cp as String,
                        'wi.unigrav.core.floor.FloorAggregationPerfRunner',
                        '--mode=preflight', "--variant=${variant}",
                        "--expected-floor-root=${input.root}"
                ].collect { Object argument -> String.valueOf(argument) }
                List<String> recordedCommand = ((row.command ?: []) as List).collect { Object argument -> String.valueOf(argument) }
                List<String> passLines = stdout.isFile() ? stdout.readLines('UTF-8').findAll {
                    it.startsWith("PREFLIGHT_PASS protocol=${floorPerfProtocol} variant=${variant.toUpperCase(Locale.ROOT)} ")
                } : []
                if (row.status != 'PASS' || recordedCommand != expectedCommand
                        || row.classpathSha256 != sha256Bytes(input.cp.getBytes(StandardCharsets.UTF_8))
                        || row.expectedFloorRoot != input.root
                        || row.commonRunnerClassSha256 != runnerClassSha256
                        || row.commonRunnerClassInventorySha256 != runnerIdentity.sha256
                        || row.workingDirectory != new File(linkageDirectory, "${variant}-work").canonicalPath
                        || !stdout.isFile() || !stderr.isFile()
                        || row.stdoutSha256 != sha256File(stdout) || row.stderrSha256 != sha256File(stderr)
                        || passLines.size() != 1) {
                    throw new GradleException("Existing ${variant} preflight evidence does not match current classes/classpath: ${receipt}")
                }
            }
            logger.lifecycle("Verified and reused sealed baseline/candidate common-linkage preflight=${receipt}")
            return
        }

        Map rows = [:]
        inputs.each { String variant, Map input ->
            File stdout = new File(linkageDirectory, "${variant}.stdout.log")
            File stderr = new File(linkageDirectory, "${variant}.stderr.log")
            List<String> command = [
                    java25().canonicalPath, '-Xms2g', '-Xmx2g', '-Dfile.encoding=UTF-8',
                    '-cp', (input.cp as String),
                    'wi.unigrav.core.floor.FloorAggregationPerfRunner',
                    '--mode=preflight', "--variant=${variant}",
                    "--expected-floor-root=${input.root}"
            ]
            File workingDirectory = new File(linkageDirectory, "${variant}-work")
            if (!workingDirectory.mkdirs() && !workingDirectory.isDirectory()) {
                throw new GradleException("Could not create isolated ${variant} preflight working directory: ${workingDirectory}")
            }
            def result = runLogged(command, stdout, stderr, workingDirectory, 20)
            List<String> lines = stdout.readLines('UTF-8').findAll {
                it.startsWith("PREFLIGHT_PASS protocol=${floorPerfProtocol} variant=${variant.toUpperCase(Locale.ROOT)} ")
            }
            if (result.exit != 0 || lines.size() != 1) {
                throw new GradleException("Real ${variant} common-linkage preflight failed exit=${result.exit}; stdout=${stdout}; stderr=${stderr}")
            }
            rows[variant] = [
                    status: 'PASS',
                    commonRunnerClassSha256: runnerClassSha256,
                    commonRunnerClassInventorySha256: runnerIdentity.sha256,
                    workingDirectory: result.workingDirectory,
                    command: command.collect { Object argument -> String.valueOf(argument) },
                    classpathSha256: sha256Bytes(input.cp.getBytes(StandardCharsets.UTF_8)),
                    exitCode: result.exit,
                    passLineCount: lines.size(),
                    stdoutSha256: sha256File(stdout),
                    stderrSha256: sha256File(stderr),
                    expectedFloorRoot: input.root
            ]
        }
        receipt.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                protocol: floorPerfProtocol,
                status: 'PASS',
                commonRunnerClassSha256: runnerClassSha256,
                commonRunnerClassInventorySha256: runnerIdentity.sha256,
                commonRunnerClassInventory: runnerIdentity.rows,
                baseline: rows.baseline,
                candidate: rows.candidate
        ])) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle("Real baseline/candidate common linkage preflight passed: ${receipt}")
    }
}

tasks.register('verifyFloorPerfCandidateDiagnostics') {
    group = 'verification'
    description = 'Run and validate typed retained counts from the actual candidate published index/scanner structures.'
    dependsOn tasks.named('verifyFloorPerfCommonLinkage')
    dependsOn tasks.named('compileFloorPerfCandidateJava')
    doLast {
        File output = runOutputRoot()
        File report = new File(output, 'candidate-retained-counts.json')
        File stdout = new File(output, 'candidate-retained-counts.stdout.log')
        File stderr = new File(output, 'candidate-retained-counts.stderr.log')
        File receipt = new File(output, 'candidate-retained-counts-validation.json')
        File helperClass = new File(candidateHelperClasses(), 'wi/unigrav/core/floor/FloorAggregationDiagnosticsRunner.class')
        if (!helperClass.isFile()) throw new GradleException("Candidate diagnostics class is missing: ${helperClass}")
        File workingDirectory = new File(output, 'candidate-diagnostics-work')
        String candidateClasspath = ([commonClasses(), candidateHelperClasses()] + currentMainOutputFiles()
                + [baselinePaths().apiRoot] + pinnedExternalFiles())
                .collect { it.canonicalFile.path }.join(File.pathSeparator)
        List<String> command = [
                java25().canonicalPath, '-Xms2g', '-Xmx2g', '-Dfile.encoding=UTF-8',
                '-cp', candidateClasspath,
                'wi.unigrav.core.floor.FloorAggregationDiagnosticsRunner',
                '--mode=verify', "--output=${report.canonicalPath}",
                "--expected-floor-root=${currentMainClasses().canonicalPath}"
        ]
        Map reportValidation
        int exitCode
        if (receipt.isFile()) {
            Map existing = new JsonSlurper().parse(receipt) as Map
            reportValidation = validateCandidateRetainedReport(report)
            if (existing.protocol != floorPerfProtocol || existing.status != 'PASS'
                    || existing.reportPath != report.canonicalPath
                    || existing.reportSha256 != reportValidation.reportSha256
                    || existing.candidateClasspathSha256 != sha256Bytes(candidateClasspath.getBytes(StandardCharsets.UTF_8))
                    || existing.commonRunnerClassSha256 != reportValidation.commonRunnerClassSha256
                    || existing.commonRunnerClassInventorySha256 != reportValidation.commonRunnerClassInventorySha256
                    || existing.diagnosticsWorkingDirectory != workingDirectory.canonicalPath
                    || existing.helperClassSha256 != sha256File(helperClass)
                    || existing.diagnosticsStdoutSha256 != (stdout.isFile() ? sha256File(stdout) : null)
                    || existing.diagnosticsStderrSha256 != (stderr.isFile() ? sha256File(stderr) : null)
                    || existing.externalClasspathManifestSha256 != reportValidation.externalClasspathManifestSha256
                    || existing.preflightReceiptSha256 != reportValidation.preflightReceiptSha256) {
                throw new GradleException("Existing candidate typed diagnostics receipt does not match the current validated inputs: ${receipt}")
            }
            logger.lifecycle("Verified and reused sealed candidate typed retained-count evidence report=${report} receipt=${receipt}")
            return
        }

        boolean priorRunEvidence = report.exists() || stdout.exists() || stderr.exists()
        if (priorRunEvidence) {
            if (![report, stdout, stderr].every { it.isFile() }) {
                throw new GradleException("Candidate typed diagnostics has partial prior evidence; refusing to overwrite under ${output}")
            }
            reportValidation = validateCandidateRetainedReport(report)
            exitCode = 0
            logger.lifecycle("Revalidating prior candidate diagnostics report after wrapper-side contract correction; output and logs remain unchanged")
        } else {
            if (!workingDirectory.mkdirs() && !workingDirectory.isDirectory()) {
                throw new GradleException("Could not create isolated candidate diagnostics working directory: ${workingDirectory}")
            }
            def result = runLogged(command, stdout, stderr, workingDirectory, 20)
            exitCode = result.exit
            if (exitCode != 0) {
                throw new GradleException("Candidate typed retained-count process failed exit=${exitCode}; stdout=${stdout}; stderr=${stderr}")
            }
            reportValidation = validateCandidateRetainedReport(report)
        }
        List<String> passLines = stdout.readLines('UTF-8').findAll {
            it.startsWith("CANDIDATE_RETAINED_COUNTS_PASS protocol=${floorPerfProtocol} fixtures=9 path=")
        }
        if (passLines.size() != 1) {
            throw new GradleException("Candidate typed retained-count process did not emit exactly one success line: ${stdout}")
        }
        String passLine = passLines.first()
        int shaMarker = passLine.lastIndexOf(' sha256=')
        if (shaMarker < 0) throw new GradleException("Candidate typed success line has no report digest: ${stdout}")
        String reportedPath = passLine.substring(passLine.indexOf(' path=') + 6, shaMarker)
        String reportedSha = passLine.substring(shaMarker + 8)
        if (reportedPath != report.canonicalPath
                || !reportedSha.equalsIgnoreCase(reportValidation.reportSha256 as String)) {
            throw new GradleException("Candidate typed success line does not bind the validated report: ${stdout}")
        }
        Map validation = new LinkedHashMap(reportValidation)
        validation.put('candidateClasspathSha256', sha256Bytes(candidateClasspath.getBytes(StandardCharsets.UTF_8)))
        validation.put('candidateClasspathEntryCount', candidateClasspath.split(java.util.regex.Pattern.quote(File.pathSeparator)).length)
        validation.put('diagnosticsCommand', command.collect { Object argument -> String.valueOf(argument) })
        validation.put('diagnosticsWorkingDirectory', workingDirectory.canonicalPath)
        validation.put('diagnosticsExitCode', exitCode)
        validation.put('diagnosticsStdoutSha256', sha256File(stdout))
        validation.put('diagnosticsStderrSha256', sha256File(stderr))
        Files.writeString(receipt.toPath(), JsonOutput.prettyPrint(JsonOutput.toJson(validation)) + System.lineSeparator(),
                StandardCharsets.UTF_8, java.nio.file.StandardOpenOption.CREATE_NEW, java.nio.file.StandardOpenOption.WRITE)
        logger.lifecycle("Candidate actual typed retained counts validated fixtures=9 report=${report} receipt=${receipt}")
    }
}

tasks.register('floorAggregationPerf') {
    group = 'verification'
    description = 'Run isolated scalar-versus-candidate correctness traces and CPU measurements; never a player-latency or GPU claim.'
    dependsOn tasks.named('verifyFloorPerfCommonLinkage')
    dependsOn tasks.named('compileFloorPerfCandidateJava')
    dependsOn tasks.named('verifyFloorPerfCandidateDiagnostics')
    doLast {
        def mode = providers.gradleProperty('floorPerfMode').orElse('compare').get()
        if (mode != 'compare') throw new GradleException("Unsupported floorPerfMode=${mode}; only compare is defined")
        File output = runOutputRoot()
        File diagnosticsReceipt = new File(output, 'candidate-retained-counts-validation.json')
        File diagnosticsReport = new File(output, 'candidate-retained-counts.json')
        if (!diagnosticsReceipt.isFile()) throw new GradleException("Candidate typed retained-count validation receipt is missing: ${diagnosticsReceipt}")
        Map diagnostics = new JsonSlurper().parse(diagnosticsReceipt) as Map
        if (diagnostics.protocol != floorPerfProtocol || diagnostics.status != 'PASS'
                || diagnostics.reportPath != diagnosticsReport.canonicalPath
                || diagnostics.reportSha256 != sha256File(diagnosticsReport)
                || diagnostics.externalClasspathManifestSha256 != sha256File(new File(outputRoot(), 'external-classpath-manifest.json'))
                || diagnostics.preflightReceiptSha256 != sha256File(new File(output, 'linkage/preflight.json'))) {
            throw new GradleException("Candidate typed retained-count evidence is stale or invalid: ${diagnosticsReceipt}")
        }
        validateCandidateRetainedReport(diagnosticsReport)
        boolean candidateDiagnosticsReady = true
        List<File> baselineEntries = [commonClasses(), baselinePaths().mainClasses,
                                      baselinePaths().testClasses, baselinePaths().resources,
                                      baselinePaths().apiRoot] + pinnedExternalFiles()
        List<File> candidateEntries = [commonClasses()] + currentMainOutputFiles() +
                [baselinePaths().apiRoot] + pinnedExternalFiles()
        String baselineCp = baselineEntries.collect { it.canonicalFile.path }.join(File.pathSeparator)
        String candidateCp = candidateEntries.collect { it.canonicalFile.path }.join(File.pathSeparator)
        List<String> command = [
                java25().canonicalPath, '-Xms2g', '-Xmx2g', '-Dfile.encoding=UTF-8',
                '-cp', baselineCp,
                'wi.unigrav.core.floor.FloorAggregationPerfRunner',
                '--mode=compare',
                "--baseline-classpath=${baselineCp}",
                "--candidate-classpath=${candidateCp}",
                "--output=${output.canonicalPath}",
                "--baseline-manifest=${new File(outputRoot(), 'baseline-input-manifest.json').canonicalPath}",
                "--external-manifest=${new File(outputRoot(), 'external-classpath-manifest.json').canonicalPath}",
                "--preflight-receipt=${new File(output, 'linkage/preflight.json').canonicalPath}",
                "--expected-baseline-floor-root=${baselinePaths().mainClasses.canonicalPath}",
                "--expected-candidate-floor-root=${currentMainClasses().canonicalPath}",
                "--candidate-diagnostics-ready=${candidateDiagnosticsReady}"
        ]
        String launchId = Long.toString(System.currentTimeMillis())
        Map launch = writeJavaArgumentFile(command, new File(output, "compare-launch-${launchId}.args"))
        File commandReceipt = new File(output, "compare-command-${launchId}.json")
        Files.writeString(commandReceipt.toPath(), JsonOutput.prettyPrint(JsonOutput.toJson([
                protocol: floorPerfProtocol,
                logicalCommand: launch.logicalCommand,
                processCommand: launch.processCommand,
                argumentFile: launch.argumentFile,
                argumentFileSha256: launch.argumentFileSha256,
                baselineClasspathSha256: sha256Bytes(baselineCp.getBytes(StandardCharsets.UTF_8)),
                candidateClasspathSha256: sha256Bytes(candidateCp.getBytes(StandardCharsets.UTF_8))
        ])) + System.lineSeparator(), StandardCharsets.UTF_8,
                java.nio.file.StandardOpenOption.CREATE_NEW, java.nio.file.StandardOpenOption.WRITE)
        File compareStdout = new File(output, 'compare-' + launchId + '.stdout.log')
        File compareStderr = new File(output, 'compare-' + launchId + '.stderr.log')
        File compareWorkingDirectory = new File(output, 'compare-work')
        if (!compareWorkingDirectory.mkdirs() && !compareWorkingDirectory.isDirectory()) {
            throw new GradleException("Could not create isolated compare-parent working directory: ${compareWorkingDirectory}")
        }
        def result = runLogged(launch.processCommand as List<String>, compareStdout,
                compareStderr, compareWorkingDirectory, 360)
        File executionReceipt = new File(output, "compare-execution-${launchId}.json")
        Files.writeString(executionReceipt.toPath(), JsonOutput.prettyPrint(JsonOutput.toJson([
                protocol: floorPerfProtocol,
                commandReceipt: commandReceipt.canonicalPath,
                commandReceiptSha256: sha256File(commandReceipt),
                exitCode: result.exit,
                stdout: result.stdout.canonicalPath,
                stdoutSha256: sha256File(result.stdout),
                stderr: result.stderr.canonicalPath,
                stderrSha256: sha256File(result.stderr),
                workingDirectory: result.workingDirectory
        ])) + System.lineSeparator(), StandardCharsets.UTF_8,
                java.nio.file.StandardOpenOption.CREATE_NEW, java.nio.file.StandardOpenOption.WRITE)
        if (result.exit != 0) {
            throw new GradleException("Floor performance comparison did not pass exit=${result.exit}; stdout=${result.stdout}; stderr=${result.stderr}")
        }
        if (!candidateDiagnosticsReady) {
            throw new GradleException('Common traces/measurements were captured, but the candidate-only retainedCounts helper is not integrated; result is NON_PASS and F08 remains incomplete.')
        }
    }
}

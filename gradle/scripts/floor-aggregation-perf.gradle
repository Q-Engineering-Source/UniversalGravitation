def sha256Bytes = { byte[] bytes ->
    MessageDigest.getInstance('SHA-256').digest(bytes).collect { String.format('%02X', it & 0xff) }.join()
}

def sha256File = { File path ->
    if (!path.isFile()) throw new GradleException("Required input is not a regular file: ${path}")
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    path.withInputStream { input ->
        byte[] buffer = new byte[1024 * 64]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02X', it & 0xff) }.join()
}

def isGeneratedMappingArchive = { File path ->
    String root = projectDir.canonicalPath.replace('\\', '/')
    String canonical = path.canonicalPath.replace('\\', '/')
    canonical.startsWith(root + '/.gradle/unimined/local/mappings/')
            && canonical.endsWith('/srg2mcp.jar')
}

// Unimined rewrites this generated ZIP's entry timestamps during project
// configuration. Bind its mapping payloads, names, and lengths while retaining
// the original raw archive SHA in the manifest; every other dependency remains
// byte-for-byte pinned.
def zipEntryPayloadSha256 = { File archive ->
    ZipFile zip = null
    Throwable primary = null
    try {
        zip = new ZipFile(archive)
        List<ZipEntry> entries = []
        def enumeration = zip.entries()
        while (enumeration.hasMoreElements()) entries.add(enumeration.nextElement())
        entries.sort { ZipEntry left, ZipEntry right -> left.name <=> right.name }
        Set<String> names = new HashSet<>()
        entries.each { ZipEntry entry ->
            if (!names.add(entry.name)) throw new GradleException("Duplicate ZIP entry in generated mapping archive ${archive}: ${entry.name}")
            if (entry.size < 0L) throw new GradleException("Unknown ZIP entry size in generated mapping archive ${archive}: ${entry.name}")
        }
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        digest.update(ByteBuffer.allocate(4).putInt(entries.size()).array())
        entries.each { ZipEntry entry ->
            byte[] name = entry.name.getBytes(StandardCharsets.UTF_8)
            digest.update(ByteBuffer.allocate(4).putInt(name.length).array())
            digest.update(name)
            digest.update((byte) (entry.isDirectory() ? 1 : 0))
            digest.update(ByteBuffer.allocate(8).putLong(entry.size).array())
            long observedBytes = 0L
            if (!entry.isDirectory()) {
                zip.getInputStream(entry).withCloseable { InputStream input ->
                    byte[] buffer = new byte[65536]
                    int read
                    while ((read = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, read)
                        observedBytes += read
                    }
                }
            }
            if (observedBytes != entry.size) {
                throw new GradleException("ZIP entry payload length changed in generated mapping archive ${archive}: ${entry.name}")
            }
        }
        return HexFormat.of().formatHex(digest.digest())
    } catch (Throwable failure) {
        primary = failure
        if (failure instanceof GradleException) throw failure
        throw new GradleException("Could not fingerprint generated mapping archive payloads: ${archive}", failure)
    } finally {
        if (zip != null) {
            try {
                zip.close()
            } catch (Throwable closeFailure) {
                if (primary != null) {
                    if (closeFailure != primary) primary.addSuppressed(closeFailure)
                } else {
                    throw new GradleException("Could not close generated mapping archive: ${archive}", closeFailure)
                }
            }
        }
    }
}

def zipEntryPayloadRows = { File archive ->
    ZipFile zip = null
    Throwable primary = null
    try {
        zip = new ZipFile(archive)
        List<ZipEntry> entries = []
        def enumeration = zip.entries()
        while (enumeration.hasMoreElements()) entries.add(enumeration.nextElement())
        entries.sort { ZipEntry left, ZipEntry right -> left.name <=> right.name }
        Set<String> names = new HashSet<>()
        List<Map> rows = []
        entries.each { ZipEntry entry ->
            if (!names.add(entry.name)) throw new GradleException("Duplicate ZIP entry in generated mapping archive ${archive}: ${entry.name}")
            if (entry.size < 0L) throw new GradleException("Unknown ZIP entry size in generated mapping archive ${archive}: ${entry.name}")
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            long observedBytes = 0L
            if (!entry.isDirectory()) {
                zip.getInputStream(entry).withCloseable { InputStream input ->
                    byte[] buffer = new byte[65536]
                    int read
                    while ((read = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, read)
                        observedBytes += read
                    }
                }
            }
            if (observedBytes != entry.size) {
                throw new GradleException("ZIP entry payload length changed in generated mapping archive ${archive}: ${entry.name}")
            }
            rows.add([
                    name: entry.name,
                    bytes: entry.size,
                    directory: entry.isDirectory(),
                    sha256: digest.digest().collect { String.format('%02X', it & 0xff) }.join()
            ])
        }
        return rows
    } catch (Throwable failure) {
        primary = failure
        if (failure instanceof GradleException) throw failure
        throw new GradleException("Could not inventory generated mapping archive payloads: ${archive}", failure)
    } finally {
        if (zip != null) {
            try {
                zip.close()
            } catch (Throwable closeFailure) {
                if (primary != null) {
                    if (closeFailure != primary) primary.addSuppressed(closeFailure)
                } else {
                    throw new GradleException("Could not close generated mapping archive: ${archive}", closeFailure)
                }
            }
        }
    }
}

def inventoryDirectory = { File root ->
    if (!root.isDirectory()) throw new GradleException("Pinned inventory directory is missing: ${root}")
    def entries = []
    Files.walk(root.toPath()).withCloseable { stream ->
        stream.filter { Files.isRegularFile(it) }
                .sorted()
                .forEach { path ->
                    File source = path.toFile()
                    entries.add([
                            path: root.toPath().relativize(path).toString().replace('\\', '/'),
                            bytes: source.length(),
                            sha256: sha256File(source)
                    ])
                }
    }
    entries
}

def verifyInventory = { File inventoryFile, File root, String expectedInventorySha, String label ->
    String observedInventorySha = sha256File(inventoryFile)
    if (observedInventorySha != expectedInventorySha) {
        throw new GradleException("${label} inventory file digest mismatch expected=${expectedInventorySha} actual=${observedInventorySha}")
    }
    List<String> lines = inventoryFile.readLines('UTF-8')
    if (lines.isEmpty() || lines.first() != 'path\tbytes\tsha256') {
        throw new GradleException("${label} inventory header is unsupported: ${inventoryFile}")
    }
    Set<String> expectedPaths = new LinkedHashSet<>()
    long bytesTotal = 0L
    lines.drop(1).eachWithIndex { String line, int row ->
        List<String> fields = line.split('\t', -1) as List<String>
        if (fields.size() != 3) throw new GradleException("${label} malformed inventory row ${row + 2}")
        String relative = fields[0].replace('\\', '/')
        if (relative.startsWith('/') || relative.split('/').any { it == '..' }) {
            throw new GradleException("${label} inventory path escapes its root: ${relative}")
        }
        File target = new File(root, relative).canonicalFile
        if (!target.toPath().startsWith(root.canonicalFile.toPath())) {
            throw new GradleException("${label} inventory path escapes its root: ${relative}")
        }
        if (!target.isFile()) throw new GradleException("${label} pinned file is missing: ${target}")
        long expectedBytes = Long.parseLong(fields[1])
        String expectedSha = fields[2].toUpperCase(Locale.ROOT)
        long actualBytes = target.length()
        String actualSha = sha256File(target)
        if (actualBytes != expectedBytes || actualSha != expectedSha) {
            throw new GradleException("${label} file mismatch ${relative}: expected=${expectedBytes}/${expectedSha} actual=${actualBytes}/${actualSha}")
        }
        if (!expectedPaths.add(relative)) throw new GradleException("${label} duplicate inventory path: ${relative}")
        bytesTotal = Math.addExact(bytesTotal, actualBytes)
    }
    Map observedFiles = inventoryDirectory(root).findAll { it.path.endsWith('.class') }
            .collectEntries { [(it.path): it] }
    Map expectedFiles = expectedPaths.findAll { it.endsWith('.class') }.collectEntries {
        [(it): true]
    }
    if (observedFiles.keySet() != expectedFiles.keySet()) {
        Set extra = observedFiles.keySet() - expectedFiles.keySet()
        Set missing = expectedFiles.keySet() - observedFiles.keySet()
        throw new GradleException("${label} class inventory coverage mismatch extra=${extra.size()} missing=${missing.size()}")
    }
    [files: expectedPaths.size(), bytes: bytesTotal, sha256: observedInventorySha]
}

